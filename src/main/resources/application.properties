spring.application.name=MoneyManager

#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test

spring.app.jwtExpirationMS=${DATASOURCE_EXPIRATIONS}
spring.app.jwtSecret=${DATASOURCE_SECRET}
spring.app.jwtCookie=${DATASOURCE_COOKIE}

# MySQL configuration
spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USER}
spring.datasource.password=${DATASOURCE_PASSWORD_POSTGRES}

#server.servlet.context-path=/api/v1.0

#JPA configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

#Email Configuration
spring.mail.host=${DATASOURCE_MAIL_HOST}
spring.mail.port=${DATASOURCE_MAIL_PORT}
spring.mail.username=${DATASOURCE_USERNAME}
spring.mail.password=${DATASOURCE_PASSWORD}
spring.mail.properties.mail.smtp.auth=${DATASOURCE_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${DATASOURCE_MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.protocol=${DATASOURCE_MAIL_PROTOCOL}
spring.mail.properties.mail.smtp.from=${DATASOURCE_MAIL_SMTP_FROM}

spring.app.money.manager.frontend.url=${DATASOURCE_MONEY_MANAGER_FRONTEND_URL}

app.activation.url=${MONEY_MANAGER_BACKEND_URL}
